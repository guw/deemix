name: Build and Publish Electron GUI

on:
  push:
    tags:
      - deemix-gui@*
  pull_request:
    branches:
      - "main*"
    paths:
      - packages/gui/**
      - .github/workflows/build-release-electron.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-node-24
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install distutils
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      - name: Set PYTHON env var
        run: echo "PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm --filter deemix-gui run electron-rebuild

      - name: Run the make script (packaging)
        run: pnpm --filter deemix-gui run make

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deemix-gui-${{ matrix.os }}
          path: packages/gui/out

  create-release:
    name: Create GitHub release and attach artifacts
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download artifacts from matrix jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts (debug)
        run: ls -R artifacts || true

      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: artifacts/**/*
          draft: true
          prerelease: true
          title: Deemix GUI ${{ replace(github.ref_name, 'deemix-gui@', '') }}
          generate_release_notes: true
